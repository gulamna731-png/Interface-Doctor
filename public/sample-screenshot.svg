<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Sample landing page screenshot">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- Top nav -->
  <rect x="0" y="0" width="1200" height="72" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="48" cy="36" r="18" fill="#0d9488"/>
  <rect x="80" y="28" width="120" height="16" rx="4" fill="#0f172a"/>
  <rect x="920" y="30" width="64" height="12" rx="3" fill="#64748b"/>
  <rect x="1010" y="30" width="64" height="12" rx="3" fill="#64748b"/>
  <rect x="1100" y="30" width="64" height="12" rx="3" fill="#64748b"/>

  <!-- Hero -->
  <rect x="0" y="72" width="1200" height="360" fill="url(#heroGrad)"/>
  <rect x="80" y="140" width="520" height="44" rx="6" fill="#0f172a"/>
  <rect x="80" y="208" width="460" height="16" rx="3" fill="#475569"/>
  <rect x="80" y="236" width="400" height="16" rx="3" fill="#475569"/>
  <rect x="80" y="284" width="140" height="44" rx="8" fill="#0d9488"/>
  <rect x="80" y="298" width="108" height="16" rx="3" fill="#ffffff"/>
  <rect x="680" y="120" width="440" height="240" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="720" y="160" width="360" height="180" rx="8" fill="#f1f5f9"/>

  <!-- Feature cards -->
  <rect x="80" y="480" width="320" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="120" y="520" width="64" height="64" rx="12" fill="#ccfbf1"/>
  <rect x="120" y="604" width="200" height="20" rx="3" fill="#0f172a"/>
  <rect x="120" y="636" width="240" height="12" rx="3" fill="#64748b"/>
  <rect x="120" y="656" width="220" height="12" rx="3" fill="#64748b"/>

  <rect x="440" y="480" width="320" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="480" y="520" width="64" height="64" rx="12" fill="#fef3c7"/>
  <rect x="480" y="604" width="200" height="20" rx="3" fill="#0f172a"/>
  <rect x="480" y="636" width="240" height="12" rx="3" fill="#64748b"/>
  <rect x="480" y="656" width="220" height="12" rx="3" fill="#64748b"/>

  <rect x="800" y="480" width="320" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="840" y="520" width="64" height="64" rx="12" fill="#fee2e2"/>
  <rect x="840" y="604" width="200" height="20" rx="3" fill="#0f172a"/>
  <rect x="840" y="636" width="240" height="12" rx="3" fill="#64748b"/>
  <rect x="840" y="656" width="220" height="12" rx="3" fill="#64748b"/>

  <!-- Low-contrast text example -->
  <rect x="80" y="720" width="1040" height="48" rx="8" fill="#f8fafc"/>
  <rect x="100" y="736" width="520" height="16" rx="3" fill="#cbd5e1"/>
</svg>
